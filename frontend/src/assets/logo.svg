<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="260" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pinGradient" x1="0" y1="20" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#3AB0A3"/>
    </linearGradient>
  </defs>
  <!-- Map pin top circle -->
  <circle cx="100" cy="60" r="40" fill="url(#pinGradient)" />
  <!-- Pin bottom triangle -->
  <path d="M60,60 L100,200 L140,60 Z" fill="url(#pinGradient)" />
  <!-- Globe circle -->
  <circle cx="100" cy="200" r="60" fill="#3AB0A3" />
  <!-- Globe latitude line -->
  <path d="M40,200 C70,180 130,220 160,200" stroke="#FFFFFF" stroke-width="4" fill="none"/>
  <!-- Globe longitude line -->
  <path d="M100,140 C90,170 110,230 100,260" stroke="#FFFFFF" stroke-width="4" fill="none"/>
  <!-- Winding path on globe -->
  <path d="M80,210 C100,180 140,240 120,210" stroke="#FFFFFF" stroke-width="6" fill="none"/>
</svg>
